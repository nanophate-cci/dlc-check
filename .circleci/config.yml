version: 2.1

jobs:
  docker_layer_caching:
    docker:
    - image: cimg/base:current
    resource_class: medium # specify a resource class
    parallelism: 2
    steps:
    - checkout
    - run: which docker
    - run: docker -v
    - setup_remote_docker:
        docker_layer_caching: true
    - run: docker image ls --all
    - run:
        command: |
          while true; do
            sleep 1
            printf "\n\n$(date)\n"
            docker image ls -a
            echo "======"
          done
        background: true
    - run:
        name: Build a really docker image
        command: |          
          # docker build -f Dockerfile --tag throwaway:$CIRCLE_BUILD_NUM .
          docker image ls -a
          dockerfile=Dockerfile
          echo "FROM golang:1.16 AS builder" > $dockerfile
          echo "RUN echo hello" >> $dockerfile
          echo " " >> $dockerfile
          echo "FROM gcc:11.2.0" > $dockerfile
          echo "RUN DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y   cmake   python3-pip   python3" >> $dockerfile
          echo "RUN pip3 install --upgrade conan" >> $dockerfile
          echo "RUN echo hello" >> $dockerfile
          docker build -f $dockerfile --tag throwaway:$CIRCLE_BUILD_NUM .
          docker images ls -a
          docker run --rm throwaway:$CIRCLE_BUILD_NUM
    - run: docker image ls --all
    - run:
        name: Check Docker cache status
        command: |
          echo "=== Docker Images Present ==="
          docker image ls --all
          echo ""
          echo "=== Docker Build Cache ==="
          docker builder du --verbose || docker system df -v
          echo ""
          echo "=== Recently Built Image Layers ==="
          # Get the most recently created image ID
          LATEST_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -1)
          echo "Checking image: $LATEST_IMAGE"
          docker history $LATEST_IMAGE --no-trunc
       
  machine_dlc:
    machine:
      docker_layer_caching: true
    parallelism: 2
    steps:
    - checkout 
    - run: which docker
    - run: docker -v
    - run: docker image ls --all
    - run:
        command: |
          while true; do
            sleep 1
            printf "\n\n$(date)\n"
            docker image ls -a
            echo "======"
          done
        background: true
    - run:
        name: Build a really docker image
        command: |
          docker image ls -a
          dockerfile=Dockerfile
          echo "FROM golang:1.16 AS builder" > $dockerfile
          echo "RUN echo hello" >> $dockerfile
          echo " " >> $dockerfile
          echo "FROM gcc:11.2.0" > $dockerfile
          echo "RUN DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y   cmake   python3-pip   python3" >> $dockerfile
          echo "RUN pip3 install --upgrade conan" >> $dockerfile
          echo "RUN echo hello" >> $dockerfile
          docker build -f $dockerfile --tag throwaway:$CIRCLE_BUILD_NUM .
          docker images ls -a
          docker run --rm throwaway:$CIRCLE_BUILD_NUM
    - run: docker version
    - run: docker image ls --all
    # Add this step after your Docker build to see cached images and layers
    - run:
        name: Check Docker cache status
        command: |
          echo "=== Docker Images Present ==="
          docker image ls --all
          echo ""
          echo "=== Docker Build Cache ==="
          docker builder du --verbose || docker system df -v
          echo ""
          echo "=== Recently Built Image Layers ==="
          # Get the most recently created image ID
          LATEST_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -1)
          echo "Checking image: $LATEST_IMAGE"
          docker history $LATEST_IMAGE --no-trunc
         
workflows:
  version: 2
  vm_jobs:
    jobs:
      - docker_layer_caching
      - machine_dlc
